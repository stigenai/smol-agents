apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruns.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: AgentRun
    plural: agentruns
    singular: agentrun
    shortNames: [arun]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agentRef
        - name: State
          type: string
          jsonPath: .status.state
        - name: Pending
          type: string
          description: The pending human action a run is waiting on (e.g. pre-run), if any (M5).
          jsonPath: .status.pendingAction.kind
        - name: Steps
          type: integer
          jsonPath: .status.usage.steps
        - name: Tokens
          type: integer
          jsonPath: .status.usage.tokens
        - name: Started
          type: date
          jsonPath: .status.startedAt
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            AgentRun is a single bounded execution of an Agent. The operator
            renders a pod from the referenced Agent and this run's input; the
            sandbox and egress posture are inherited from the Agent (there is no
            per-run override). Progress and the final answer are folded back into
            status.
          required: [spec]
          properties:
            spec:
              type: object
              description: AgentRunSpec is the desired state of a run.
              required: [agentRef, input]
              properties:
                agentRef: { type: string, minLength: 1, description: 'Name of the Agent in this namespace to execute.' }
                sessionRef: { type: string, description: 'Optionally associates the run with an AgentSession (for grouping/checkpointing).' }
                resumeSessionID: { type: string, description: 'Resume a prior harness conversation (M3.19): a session id from an earlier run''s status.harnessSessionID (claude --resume / codex exec resume). Empty = fresh session.' }
                input:
                  type: object
                  description: |-
                    JSON payload handed to the agent for this run; rides the run
                    spec into a ~1MiB ConfigMap. Use spec.inputs[].secretRef for
                    large or secret payloads.
                  x-kubernetes-preserve-unknown-fields: true
                seed: { type: integer, format: int64, description: 'Optional determinism seed forwarded to the runtime/model where supported.' }
                budgetOverride:
                  type: object
                  description: |-
                    Escalates the Agent budget for THIS run. In harness mode only
                    maxTokens/maxWallClockSeconds bind at runtime; maxSteps and
                    maxToolCalls are post-hoc accounting only.
                  properties:
                    maxSteps: { type: integer, minimum: 1, description: 'Override for maximum plan-act-observe steps.' }
                    maxTokens: { type: integer, minimum: 1, description: 'Override for maximum total LLM tokens.' }
                    maxWallClockSeconds: { type: integer, minimum: 1, description: 'Override for maximum run wall-clock duration in seconds.' }
                    maxToolCalls: { type: integer, minimum: 0, description: 'Override for maximum total tool invocations.' }
                cancel: { type: boolean, description: 'Set true to request cancellation; the controller deletes the run pod (immediate, no graceful drain).' }
                placementFallback: { type: string, enum: [Pending, Schedule], description: 'When a kata run finds no matching AgentNodePool: Pending (default, fail-closed) holds until capacity; Schedule runs without node affinity (dev escape hatch). (M1.10)' }
                requireApprovalBeforeRun: { type: boolean, description: 'Per-run override of the Agent ApprovalPolicy: hold this run in RequiresAction until a human approves (M5).' }
                priority: { type: integer, format: int32, description: 'Per-namespace admission-queue priority when at the concurrency cap (M1.13): higher admitted first, ties by creation time. Clamped to the operator MaxPriority. 0 = normal.' }
                decision:
                  type: object
                  description: 'Human pre-run approval verdict, patched onto a run waiting in RequiresAction (M5). Token must match status.pendingAction.token.'
                  properties:
                    token: { type: string, description: 'Must match status.pendingAction.token; a stale token is ignored.' }
                    approve: { type: boolean, description: 'true to proceed; false denies (run becomes Cancelled).' }
                    reason: { type: string, description: 'Optional human note.' }
                    decidedBy: { type: string, description: 'Optional identity of the approver.' }
                  required: [token]
                memoryRetrieverRef:
                  type: string
                  description: |-
                    Namespace-local MemoryRetriever whose filesystem store is
                    mounted when its spec.mount.enabled is true (R-MEM-FS-2).
                    Empty = no memory FS.
                inputs:
                  type: array
                  description: |-
                    Files materialized into the agent's workspace before the run
                    executes. Requires a workspace (the Agent's storage.agentfs
                    mount or harness.cli.workingDir); a run with inputs but no
                    workspace fails loud. Exactly one source per entry.
                  items:
                    type: object
                    properties:
                      path: { type: string, description: 'Destination relative to workspace root; must be relative, no "..". Validated in the builder; requires a workspace.' }
                      inline: { type: string, description: 'Literal UTF-8 file content.' }
                      inlineBase64: { type: string, description: 'Base64-encoded file content (binary payloads).' }
                      secretRef:
                        type: object
                        description: Source file content from a Secret leased by the broker at runtime (never written into the AgentRun spec).
                        properties:
                          secretName: { type: string, description: 'Name of the Secret.' }
                          key: { type: string, description: 'Key within the Secret''s data.' }
            status:
              type: object
              description: RunStatus is the observed lifecycle and result of the run.
              properties:
                state:
                  type: string
                  description: |-
                    Run lifecycle state: Pending (queued) | Running |
                    RequiresAction (awaiting external input) | Completed |
                    Failed | Cancelled | Expired (budget/wall-clock exhausted).
                  enum: [Pending, Running, RequiresAction, Completed, Failed, Cancelled, Expired]
                startedAt: { type: string, format: date-time, description: 'When the run pod started executing.' }
                endedAt: { type: string, format: date-time, description: 'When the run reached a terminal state.' }
                terminationReason: { type: string, description: 'Machine-readable reason for a terminal state (e.g. budget exceeded, error).' }
                reason: { type: string, description: 'Short machine-readable cause for the current State (e.g. ConcurrencyLimited, SandboxNotReady).' }
                harnessSessionID: { type: string, description: 'Harness session/thread id from this run (claude session_id, codex thread); pass to a later run''s spec.resumeSessionID to resume (M3.19).' }
                networks: { type: array, items: { type: string }, description: 'AgentNetworks bound to this run (M1.19); empty = default-deny floor only.' }
                egressEnforcement: { type: string, description: 'Egress posture: default-deny (floor only) or tiered (bound allow-list layered).' }
                pendingAction:
                  type: object
                  description: 'Set while state==RequiresAction: the approval the run is waiting on (M5).'
                  properties:
                    kind: { type: string, description: 'Why the run is paused (currently "pre-run").' }
                    token: { type: string, description: 'Token a human must echo in spec.decision.token to act.' }
                    requestedAt: { type: string, format: date-time, description: 'When the pause began (drives the approval TTL).' }
                    reason: { type: string, description: 'Human-readable pause reason.' }
                trace:
                  type: object
                  description: 'Compact step/tool-call metadata that survives when full steps are clamped from the termination message (M2.2).'
                  properties:
                    stepCount: { type: integer, description: 'Number of execution steps.' }
                    toolCallCount: { type: integer, description: 'Total tool calls across steps.' }
                    truncated: { type: boolean, description: 'True when step detail was dropped from the termination message.' }
                    droppedBytes: { type: integer, format: int64, description: 'Bytes of step detail dropped.' }
                    overflowRef: { type: string, description: 'Object-store ref to the full trace when offloaded (M2.9).' }
                artifacts:
                  type: object
                  description: 'Folded artifact-egress result (M2.26), observability-only — the state the agentfs-sidecar reported plus per-file refs (a prefix of the full set if the manifest exceeded the termination-message cap; files are still in S3).'
                  properties:
                    state: { type: string, description: 'Complete | Partial | Failed (Failed = egress requested but the sidecar reported nothing).' }
                    refs:
                      type: array
                      description: Collected files.
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          path: { type: string }
                          s3Key: { type: string }
                          sizeBytes: { type: integer, format: int64 }
                          sha256: { type: string }
                          skipped: { type: string, description: 'Reason a declared output was not uploaded (empty = uploaded).' }
                output:
                  description: |-
                    The run's answer as arbitrary JSON — a structured object for
                    schema-constrained agents, or a bare JSON string for a
                    harness that returns free-form text. Omitting `type` (with
                    preserve-unknown-fields) accepts any JSON value.
                  x-kubernetes-preserve-unknown-fields: true
                usage:
                  type: object
                  description: Resource accounting for the run, folded back from the pod.
                  properties:
                    steps: { type: integer, description: 'Plan-act-observe steps executed.' }
                    tokens: { type: integer, description: 'Total LLM tokens consumed.' }
                    toolCalls: { type: integer, description: 'Total tool invocations.' }
                    wallClockUsed: { type: integer, format: int64, description: 'Wall-clock seconds consumed.' }
                    costUSDMilli: { type: integer, format: int64, description: 'Backend-reported cost in integer milli-USD (observability-only; never gated).' }
                steps:
                  type: array
                  description: |-
                    Per-step plan-act-observe trace, folded into status from the
                    run; large traces may be truncated by the ~4KiB pod
                    termination-message cap.
                  items:
                    type: object
                    properties:
                      index: { type: integer, description: 'Zero-based step ordinal.' }
                      kind: { type: string, description: 'Step kind (e.g. plan, act, observe).' }
                      startedAt: { type: string, format: date-time, description: 'When the step started.' }
                      endedAt: { type: string, format: date-time, description: 'When the step ended.' }
                      tokensIn: { type: integer, description: 'Prompt tokens for this step.' }
                      tokensOut: { type: integer, description: 'Completion tokens for this step.' }
                      error: { type: string, description: 'Error message if the step failed.' }
                      toolCalls:
                        type: array
                        description: Tool invocations made during this step (arbitrary JSON per call).
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  description: Conditions follows the standard Kubernetes condition pattern (Ready/Progressing), enabling `kubectl wait --for=condition=Ready`.
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime: { type: string, format: date-time, description: 'Last time the condition transitioned from one status to another.' }
                      message: { type: string, maxLength: 32768, description: 'Human readable message indicating details about the transition.' }
                      observedGeneration: { type: integer, format: int64, minimum: 0, description: 'The .metadata.generation the condition was set based upon.' }
                      reason: { type: string, maxLength: 1024, minLength: 1, pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$', description: 'Programmatic identifier for the condition''s last transition (CamelCase).' }
                      status: { type: string, enum: ["True", "False", "Unknown"], description: 'Status of the condition.' }
                      type: { type: string, maxLength: 316, pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$', description: 'Type of condition in CamelCase.' }
