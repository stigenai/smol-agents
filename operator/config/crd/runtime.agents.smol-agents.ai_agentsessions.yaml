apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsessions.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: AgentSession
    plural: agentsessions
    singular: agentsession
    shortNames: [asess]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Agent, type: string, jsonPath: .spec.agentRef }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            AgentSession runs a long-lived 1-replica worker pod that accepts
            turns via NATS/gateway and checkpoints session state (turns+usage)
            to AgentFS for crash recovery. See
            docs/design/durable-session-architecture.md.
          required: [spec]
          properties:
            spec:
              type: object
              description: AgentSessionSpec is the desired state of a session.
              properties:
                agentRef: { type: string, minLength: 1, description: 'Name of the Agent in this namespace the session worker runs.' }
                idleTimeoutSeconds:
                  type: integer
                  minimum: 0
                  description: Seconds idle before the worker parks and exits for scale-to-zero; 0 (default) keeps it resident.
                maxConcurrentTurns: { type: integer, minimum: 0, description: 'Turn-processing width (0/1 = serial; >1 opt-in concurrency, M2.17).' }
                turnRetentionSeconds: { type: integer, minimum: 0, description: 'NATS turn-stream retention (0 = 3600s default).' }
                turnHistoryLimit: { type: integer, minimum: 0, description: 'Max retained in-memory turns (0 = unbounded).' }
                maxTurnInputBytes: { type: integer, minimum: 0, description: 'Per-turn input ceiling (0 = 1 MiB default).' }
                turnBatchSize: { type: integer, minimum: 0, description: 'Queued turns pulled per poll (0 = 1).' }
                turnPollIntervalMs: { type: integer, minimum: 0, description: 'Worker inbox poll cadence in ms (0 = 500).' }
                turnDeliveryTimeoutSeconds: { type: integer, minimum: 0, description: 'Per-turn processing timeout (0 = 300s); must be <= turnRetentionSeconds (M2.22).' }
                memoryScope: { type: string, description: 'Optional cross-turn memory partition key for Hermes sessions (M3.12); injected as HERMES_SESSION_KEY. Empty = session-id alone scopes memory.' }
                resources:
                  type: object
                  description: 'Compute request/limit for the resident session worker container (M1.11). A session has no wall-clock deadline (idle timeout bounds it), so worker sizing is here, not via a budget. Quantities are strings (e.g. 500m, 512Mi); the operator parses them and the webhook rejects unparseable values.'
                  properties:
                    limits:
                      type: object
                      additionalProperties: { type: string }
                    requests:
                      type: object
                      additionalProperties: { type: string }
              required: [agentRef]
            status:
              type: object
              description: AgentSessionStatus is the observed state of the session worker.
              properties:
                phase: { type: string, description: 'Worker lifecycle: Pending until available, then Running.' }
                observedGeneration: { type: integer, description: 'spec.metadata.generation last reconciled by the controller.' }
                runs:
                  type: array
                  description: LEGACY/DEAD — never written by the reconciler; do not rely on it.
                  items: { type: string }
                networks: { type: array, items: { type: string }, description: 'AgentNetworks bound to this session (M1.19); empty = default-deny floor only.' }
                egressEnforcement: { type: string, description: 'Egress posture: default-deny (floor only) or tiered (bound allow-list layered).' }
                transport: { type: string, description: 'Active turn-delivery transport: nats (gateway path wired) or on-disk (DEGRADED — operator has no session NATS URL, so gateway /turns never reach the worker).' }
                reason: { type: string, description: 'Short machine-readable cause for the current phase (AgentMissing, SandboxNotReady, SecretMissing, NoKVMCapacity, Reconciled, ...).' }
                message: { type: string, description: 'Human-readable elaboration of reason.' }
                usage:
                  type: object
                  description: 'Cumulative resource accounting across all turns, mirrored field-wise from the worker checkpoint (M2.19). Observability only.'
                  properties:
                    steps: { type: integer }
                    tokens: { type: integer, format: int64 }
                    toolCalls: { type: integer }
                    wallClockUsed: { type: integer, format: int64 }
                    costUSDMilli: { type: integer, format: int64, description: 'Backend cost in milli-USD (never gated).' }
                turns: { type: integer, format: int64, description: 'Monotonic count of turns processed (survives history compaction).' }
                failedTurns: { type: integer, format: int64, description: 'Turns that ended in error.' }
                lastTurnTime: { type: string, format: date-time, description: 'When the most recent turn completed.' }
                conditions:
                  type: array
                  description: Conditions follows the standard Kubernetes condition pattern (Ready/Progressing), enabling `kubectl wait --for=condition=Ready`.
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime: { type: string, format: date-time, description: 'Last time the condition transitioned from one status to another.' }
                      message: { type: string, maxLength: 32768, description: 'Human readable message indicating details about the transition.' }
                      observedGeneration: { type: integer, format: int64, minimum: 0, description: 'The .metadata.generation the condition was set based upon.' }
                      reason: { type: string, maxLength: 1024, minLength: 1, pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$', description: 'Programmatic identifier for the condition''s last transition (CamelCase).' }
                      status: { type: string, enum: ["True", "False", "Unknown"], description: 'Status of the condition.' }
                      type: { type: string, maxLength: 316, pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$', description: 'Type of condition in CamelCase.' }
