apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: Agent
    plural: agents
    singular: agent
    shortNames: [ag]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.name
        - name: Provider
          type: string
          jsonPath: .spec.model.providerRef
        - name: Ready
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            Agent is the reusable definition of an autonomous agent: its model
            (or harness), system prompt, tool allow-list, budget caps, sandbox,
            and durable storage. AgentRuns and AgentSessions reference an Agent
            by name; the operator resolves and validates it, then renders the
            per-run/per-session pod from this spec.
          required: [spec]
          properties:
            spec:
              type: object
              description: AgentSpec is the desired state of an Agent.
              required: [instructions, budget]
              properties:
                mode:
                  type: string
                  description: |-
                    Execution path. loop (default) runs the in-process
                    plan-act-observe loop with spec.model+spec.tools; harness
                    delegates one bounded call to spec.harness. Mutually
                    exclusive: loop requires model and forbids harness; harness
                    requires harness and ignores model (enforced by the
                    validating webhook).
                  enum: [loop, harness]
                  default: loop
                model:
                  type: object
                  description: |-
                    LLM configuration for loop mode. Required when mode=loop and
                    forbidden when mode=harness.
                  properties:
                    providerRef:
                      type: string
                      description: Name of the namespace-local ModelProvider supplying credentials and endpoint defaults.
                    name:
                      type: string
                      description: Provider-specific model identifier (e.g. gpt-4o, claude-3-5-sonnet, glm-4.6).
                    temperature:
                      type: number
                      description: Sampling temperature; typically 0-2. Higher is more random. 0 omits the parameter.
                    topP:
                      type: number
                      description: Nucleus-sampling probability mass; typically 0-1. 0 omits the parameter.
                    maxOutputTokens:
                      type: integer
                      description: Upper bound on tokens generated per LLM call; typically >=1. 0 omits the parameter (provider default).
                harness:
                  type: object
                  description: |-
                    Harness configuration for mode=harness: delegates a single
                    bounded turn to an external CLI or HTTP agent (e.g.
                    claude-code, codex, hermes) instead of the in-process loop.
                    Required when mode=harness.
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      description: |-
                        Harness flavour. CLI kinds (claude-code, codex, pi,
                        aider, goose, generic-cli) exec a binary in the pod;
                        generic-http and hermes call an HTTP endpoint. Selects
                        the per-kind harness image and the cli/http sub-block
                        that applies.
                      enum: [claude-code, codex, pi, aider, goose, generic-cli, generic-http, hermes]
                    image:
                      type: string
                      description: OCI image override for the harness; empty uses the operator's per-kind default harness image.
                    version:
                      type: string
                      description: Harness/tool version selector; advisory, surfaced to the harness image.
                    command:
                      type: array
                      description: Entrypoint override (argv) for CLI harnesses; empty uses the image default.
                      items: { type: string }
                    sessionPolicy:
                      type: string
                      description: |-
                        ephemeral (default) starts each run with a clean
                        workspace; persistent reuses the durable AgentFS volume
                        across runs and REQUIRES spec.storage for CLI harnesses.
                      enum: [ephemeral, persistent]
                      default: ephemeral
                    env:
                      type: array
                      description: Extra environment variables for the harness container; values may be inline or sourced from a broker-leased Secret.
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: Environment variable name.
                          value:
                            type: string
                            description: Literal value; mutually exclusive with secretRef.
                          secretRef:
                            type: object
                            description: Source the value from a Secret leased by the broker at runtime instead of inlining it.
                            properties:
                              secretName: { type: string, description: 'Name of the Secret.' }
                              key: { type: string, description: 'Key within the Secret''s data.' }
                    cli:
                      type: object
                      description: CLI-harness transport settings (applies to claude-code/codex/pi/aider/goose/generic-cli).
                      properties:
                        promptFlag:
                          type: string
                          description: Flag the prompt is passed under (e.g. "-p", "--prompt"); empty uses the kind default.
                        workingDir:
                          type: string
                          description: Working directory the harness is invoked in; bound to the AgentFS workspace root when storage is attached.
                        maxOutputBytes:
                          type: integer
                          description: Cap on captured harness stdout/stderr bytes before truncation.
                        extraFlags:
                          type: array
                          description: 'Flags appended to the CLI invocation (after the kind''s fixed flags, before the prompt) for permission/sandbox flags a CLI harness needs headless, e.g. claude-code ''--dangerously-skip-permissions'' (the kata + egress sandbox is the real boundary) or codex ''--ask-for-approval never''.'
                          items: { type: string }
                        outputFormat:
                          type: string
                          enum: [text, json, stream-json]
                          description: 'CLI machine-readable output so the harness can parse tokens/cost/tool-calls (claude-code/codex parse "json"; M2.5/M3.14).'
                        approvalMode:
                          type: string
                          enum: [safe, acceptEdits, never]
                          description: 'Permission posture (claude --permission-mode / codex --ask-for-approval); "never" is the opt-in danger flag, microVM-gated at admission (D3/M3.17).'
                        allowedTools:
                          type: array
                          description: 'CLI permission allow-list (e.g. claude --allowedTools).'
                          items: { type: string }
                        disallowedTools:
                          type: array
                          description: 'CLI permission deny-list (e.g. claude --disallowedTools).'
                          items: { type: string }
                        apiKeyHelperSecret: { type: string, description: 'Opt into short-lived claude-code creds (M3.20): claude runs an apiKeyHelper that leases this broker secret via `agent lease`, re-fetching on TTL/401. Empty = static ANTHROPIC_API_KEY.' }
                        codexBaseURL: { type: string, description: 'Route codex through a platform Responses gateway (M3.21): renders ~/.codex/config.toml with [model_providers.platform] wire_api=responses pointing here. Empty = codex defaults.' }
                        codexModel: { type: string, description: 'Optional codex model id written into config.toml (M3.21).' }
                        mcpServers:
                          type: array
                          description: 'MCP servers claude-code connects to (M3.18); rendered to a --mcp-config file, mcp__<name>__* auto-allowed. stdio needs an operator-allow-listed image; http/sse URLs to internal hosts are rejected at admission.'
                          items:
                            type: object
                            required: [name, transport]
                            properties:
                              name: { type: string }
                              transport: { type: string, enum: [stdio, http, sse] }
                              command: { type: array, items: { type: string }, description: 'stdio argv (the binary + args).' }
                              url: { type: string, description: 'http/sse endpoint.' }
                              env:
                                type: array
                                items:
                                  type: object
                                  required: [name]
                                  properties:
                                    name: { type: string }
                                    value: { type: string }
                                    secretRef:
                                      type: object
                                      properties:
                                        secretName: { type: string }
                                        key: { type: string }
                    http:
                      type: object
                      description: HTTP-harness transport settings (applies to generic-http/hermes).
                      properties:
                        url:
                          type: string
                          description: Endpoint the harness turn is POSTed to.
                        api:
                          type: string
                          enum: [chat, responses, runs]
                          description: 'Hermes endpoint family: chat (default) | responses | runs. Only valid for kind=hermes (M3.9).'
                        stream: { type: boolean, description: 'Prefer a streaming transport where the API supports it (M3.9); a hint for the async /v1/runs poller.' }
                        pollIntervalMs: { type: integer, minimum: 0, description: 'Async /v1/runs poll cadence in ms (0 = 1000); M3.11.' }
                        method:
                          type: string
                          description: HTTP method; defaults to POST.
                        headers:
                          type: object
                          description: Static request headers.
                          additionalProperties: { type: string }
                        promptField:
                          type: string
                          description: JSON field in the request body carrying the prompt.
                        responseField:
                          type: string
                          description: JSON field in the response body carrying the agent's answer.
                        auth:
                          type: object
                          description: Bearer/credential Secret leased by the broker for the HTTP call.
                          properties: { secretName: { type: string, description: 'Name of the Secret holding the credential.' } }
                        retry:
                          type: object
                          description: Retry policy for transient HTTP failures (exponential backoff).
                          properties:
                            maxAttempts: { type: integer, description: 'Maximum total attempts including the first.' }
                            backoffBaseMs: { type: integer, description: 'Initial backoff delay in milliseconds.' }
                            maxBackoffMs: { type: integer, description: 'Ceiling on the backoff delay in milliseconds.' }
                        imagePolicy:
                          type: object
                          description: Controls whether the harness may fetch remote image URLs and which hosts are allowed.
                          properties:
                            allowURLs: { type: boolean, description: 'When true, the harness may dereference image URLs in the request.' }
                            allowedURLHosts:
                              type: array
                              description: Host allow-list for image URLs when allowURLs is true.
                              items: { type: string }
                    piMono:
                      type: object
                      description: 'pi-mono harness config (kind=pi-mono): the pi CLI driven over HTTP via the in-pod pi-bridge (M4.15).'
                      properties:
                        model: { type: string, description: 'pi model (passed to pi --model).' }
                        provider: { type: string, description: 'Model provider the bridge configures for pi.' }
                        mode: { type: string, description: 'pi run mode; defaults to json (required for token/tool parsing).' }
                        url: { type: string, description: 'Bridge endpoint override (default http://127.0.0.1:8848/run).' }
                        bridgePort: { type: integer, minimum: 1, description: 'In-pod bridge port (default 8848).' }
                        extraArgs: { type: array, items: { type: string }, description: 'Extra args appended to the pi invocation.' }
                        activeDeadlineSeconds: { type: integer, minimum: 0, description: 'Pod-level wall-clock cap for a pi run (M4.18); a runaway prompt is killed -> DeadlineExceeded.' }
                storage:
                  type: object
                  description: |-
                    Durable AgentFS volume for the agent's workspace. REQUIRED
                    when harness.sessionPolicy=persistent for CLI harnesses;
                    otherwise optional (runs get an ephemeral workspace).
                  properties:
                    kind:
                      type: string
                      description: 'Storage driver: "" (none/ephemeral) or agentfs (durable, content-addressed volume).'
                      enum: ["", agentfs]
                    agentfs:
                      type: object
                      description: AgentFS volume configuration; applies when kind=agentfs.
                      properties:
                        sizeGiB: { type: integer, minimum: 1, description: 'Provisioned volume size in GiB.' }
                        mountPath: { type: string, description: 'Path the AgentFS volume is mounted at inside the pod.' }
                        image: { type: string, description: 'AgentFS sidecar image override; empty uses the operator default.' }
                        backend: { type: string, enum: ["", tar, kopia], description: 'Snapshot backend: "" / tar (legacy tarball) or kopia (content-addressed snapshots).' }
                        backup:
                          type: object
                          description: Periodic snapshot + offsite backup policy.
                          properties:
                            schedule: { type: string, description: 'Cron expression for periodic snapshots.' }
                            walSnapshotInterval: { type: string, description: 'Duration between write-ahead-log snapshots between full backups (e.g. "5m").' }
                            retention:
                              type: object
                              description: Snapshot retention policy.
                              properties:
                                maxVersions: { type: integer, minimum: 1, description: 'Maximum number of snapshot versions to keep.' }
                                minAge: { type: string, description: 'Minimum age before a snapshot becomes eligible for pruning (e.g. "24h").' }
                            s3:
                              type: object
                              description: S3-compatible offsite backup target.
                              required: [bucket]
                              properties:
                                bucket: { type: string, description: 'Destination bucket.' }
                                prefix: { type: string, description: 'Key prefix within the bucket.' }
                                region: { type: string, description: 'Bucket region.' }
                                endpointURL: { type: string, description: 'Custom S3 endpoint (e.g. MinIO); empty uses AWS S3.' }
                                sseAlgorithm:
                                  type: string
                                  description: 'Server-side encryption: AES256, aws:kms, or "" (none).'
                                  enum: [AES256, "aws:kms", ""]
                                kmsKeyARN: { type: string, description: 'KMS key ARN when sseAlgorithm=aws:kms.' }
                                versioning: { type: boolean, description: 'Whether the destination bucket has object versioning enabled.' }
                                credentialsRef:
                                  type: object
                                  description: Secret holding S3 credentials, leased by the broker at runtime.
                                  properties:
                                    secretName: { type: string, description: 'Name of the Secret.' }
                                    key: { type: string, description: 'Key within the Secret''s data.' }
                        restore:
                          type: object
                          description: How the volume is hydrated on first attach.
                          properties:
                            mode:
                              type: string
                              description: 'Restore selector: latest snapshot, a specific versionID, or pointInTime.'
                              enum: [latest, versionID, pointInTime]
                            versionID: { type: string, description: 'Snapshot/version identifier when mode=versionID.' }
                            pointInTime: { type: string, description: 'RFC3339 timestamp to restore to when mode=pointInTime.' }
                            ifMissing:
                              type: string
                              description: 'Behaviour when no snapshot matches: fresh (start empty) or fail.'
                              enum: [fresh, fail]
                instructions:
                  type: string
                  description: |-
                    System prompt; required, non-empty. Avoid >100KiB — large
                    prompts bloat the run ConfigMap (~1MiB cap).
                  minLength: 1
                tools:
                  type: array
                  description: |-
                    Allow-list of Tool references. NOTE: loop-mode tool
                    invocation is NOT wired in v0.2.0 (names resolved but specs
                    never reach the pod, executor has no invokers); only
                    harness-mode agents act on tools. See
                    docs/design/tool-kinds-roadmap.md.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, description: 'Name of the Tool resource to allow.' }
                      namespace: { type: string, description: 'Namespace of the Tool; defaults to the Agent''s namespace.' }
                artifacts:
                  type: object
                  description: 'Workspace files to publish to S3 on pod shutdown (M2.23). Requires storage.agentfs + an S3 target. Best-effort, collected by the agentfs sidecar; never affects run Phase (the harness container holds no S3 creds).'
                  required: [outputs]
                  properties:
                    outputs:
                      type: array
                      items:
                        type: object
                        required: [name, glob]
                        properties:
                          name: { type: string, description: 'Stable identifier (S3 key prefix + manifest key); unique within the spec.' }
                          glob: { type: string, description: 'Workspace-relative doublestar pattern (e.g. out/**/*.json); a leading / or any .. traversal is rejected.' }
                          maxBytes: { type: integer, format: int64, minimum: 0, description: 'Per-file cap; an over-budget file is skipped (recorded), never fatal. 0 = no cap.' }
                          contentType: { type: string, description: 'Override the sniffed content type for uploaded objects.' }
                    s3:
                      type: object
                      description: 'Upload target; defaults to the AgentFS backup target.'
                      required: [bucket]
                      properties:
                        bucket: { type: string, description: 'Destination bucket.' }
                        prefix: { type: string, description: 'Key prefix within the bucket.' }
                        region: { type: string, description: 'Bucket region.' }
                        endpointURL: { type: string, description: 'Custom S3 endpoint (e.g. MinIO); empty uses AWS S3.' }
                        sseAlgorithm:
                          type: string
                          description: 'Server-side encryption: AES256, aws:kms, or "" (none).'
                          enum: [AES256, "aws:kms", ""]
                        kmsKeyARN: { type: string, description: 'KMS key ARN when sseAlgorithm=aws:kms.' }
                        versioning: { type: boolean, description: 'Whether the destination bucket has object versioning enabled.' }
                        credentialsRef:
                          type: object
                          description: Secret holding S3 credentials, leased by the broker at runtime.
                          properties:
                            secretName: { type: string, description: 'Name of the Secret.' }
                            key: { type: string, description: 'Key within the Secret''s data.' }
                budget:
                  type: object
                  description: |-
                    Hard caps enforced before every step (fail-closed). All
                    required >0 except maxToolCalls>=0.
                  required: [maxSteps, maxTokens, maxWallClockSeconds, maxToolCalls]
                  properties:
                    maxSteps: { type: integer, minimum: 1, description: 'Maximum plan-act-observe steps per run.' }
                    maxTokens: { type: integer, minimum: 1, description: 'Maximum total LLM tokens per run.' }
                    maxWallClockSeconds: { type: integer, minimum: 1, description: 'Maximum run wall-clock duration in seconds.' }
                    maxToolCalls: { type: integer, minimum: 0, description: 'Maximum total tool invocations per run (0 forbids tool calls).' }
                identity:
                  type: object
                  description: SPIFFE workload-identity settings for run pods.
                  properties:
                    spiffeIDPrefix: { type: string, description: 'SPIFFE ID sub-tree prefix; the platform appends /agent/<name>/run/<runid>.' }
                sandbox:
                  type: object
                  description: Pod isolation settings for runs of this Agent.
                  properties:
                    runtimeClass: { type: string, description: 'Pod RuntimeClass override (R-AM-SEC-2). Empty inherits the operator --default-run-runtime-class (default kata-fc). runc is rejected fail-closed unless the operator runs with --allow-host-runtime.' }
                resultSink:
                  type: string
                  description: 'URI the operator POSTs a CloudEvent to when one of this Agent''s runs completes successfully (wbb) — platform as event source. At-least-once, stable ce-id = run UID (consumers dedupe). Empty = no emission.'
                maxConcurrentRuns: { type: integer, minimum: 0, description: 'Cap concurrently-Running runs for this Agent (0 = unlimited); soft per-tenant admission gate (M1.12/D10).' }
                approval:
                  type: object
                  description: 'Gate this Agent''s runs behind a human pre-run approval (M5).'
                  properties:
                    requireApprovalBeforeRun: { type: boolean, description: 'Hold every run in RequiresAction until approved via the run''s spec.decision.' }
                    approvalTimeoutSeconds: { type: integer, minimum: 0, description: 'Expire an un-decided run after this long (0 = operator --default-approval-timeout).' }
                session:
                  type: object
                  description: 'Mark the Agent as requiring a resident session and/or an interactive attach plane (M4/D4).'
                  properties:
                    required: { type: boolean, description: 'A resident session pod that outlives a single turn.' }
                    interactive: { type: boolean, description: 'A human attach plane (implies required; rejected on a Knative deployment).' }
            status:
              type: object
              description: AgentStatus is the observed reconcile state of the Agent (NOT the AgentRun lifecycle).
              properties:
                phase:
                  type: string
                  description: 'Agent reconcile phase: Pending | Ready | Failed (tool/provider resolution) — NOT the AgentRun lifecycle.'
                observedGeneration: { type: integer, description: 'spec.metadata.generation last reconciled by the controller.' }
                resolvedTools:
                  type: array
                  description: Tool references that were successfully resolved during reconcile.
                  items: { type: string }
                resolvedProvider: { type: string, description: 'ModelProvider that was successfully resolved during reconcile (loop mode).' }
                reason: { type: string, description: 'Machine-readable reason for the current phase.' }
                message: { type: string, description: 'Human-readable detail for the current phase.' }
                conditions:
                  type: array
                  description: Conditions follows the standard Kubernetes condition pattern (Ready/Progressing), enabling `kubectl wait --for=condition=Ready`.
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime: { type: string, format: date-time, description: 'Last time the condition transitioned from one status to another.' }
                      message: { type: string, maxLength: 32768, description: 'Human readable message indicating details about the transition.' }
                      observedGeneration: { type: integer, format: int64, minimum: 0, description: 'The .metadata.generation the condition was set based upon.' }
                      reason: { type: string, maxLength: 1024, minLength: 1, pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$', description: 'Programmatic identifier for the condition''s last transition (CamelCase).' }
                      status: { type: string, enum: ["True", "False", "Unknown"], description: 'Status of the condition.' }
                      type: { type: string, maxLength: 316, pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$', description: 'Type of condition in CamelCase.' }
