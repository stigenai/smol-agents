apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelgateways.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: ModelGateway
    plural: modelgateways
    singular: modelgateway
    shortNames: [mgw]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Provider, type: string, jsonPath: .spec.provider }
        - { name: Endpoint, type: string, jsonPath: .status.endpoint }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            ModelGateway is an operator-managed model/agent gateway (yxh.2): a thin
            lifecycle+isolation wrapper that renders+hardens the gateway's Deployment,
            Service, config, and egress/ingress NetworkPolicies, instead of deploying
            it as a manual workload. provider=hermes is implementation #1
            (nousresearch/hermes-agent). The gateway is host-level RCE, so it runs
            under the same sandbox (kata-fc default) + egress floor as run pods. The
            request surface (chat/responses/runs) stays in the harness + the gateway
            config — only deployment + isolation are modeled here.
          required: [spec]
          properties:
            spec:
              type: object
              required: [provider, image]
              properties:
                provider: { type: string, enum: [hermes], description: 'Gateway implementation (only hermes today).' }
                image: { type: string, minLength: 1, description: 'Gateway container image (e.g. nousresearch/hermes-agent:latest).' }
                port: { type: integer, format: int32, minimum: 0, description: 'Listen port; 0 defaults per provider (hermes: 8642).' }
                config: { type: string, description: 'Gateway config-file content (hermes: config.yaml, the model source), seeded into the data dir.' }
                replicas: { type: integer, format: int32, minimum: 0, description: 'Gateway Deployment replicas (default 1).' }
                sandbox:
                  type: object
                  description: 'Pod RuntimeClass override; empty inherits the operator --default-run-runtime-class (kata-fc). The gateway is RCE; runc requires --allow-host-runtime.'
                  properties:
                    runtimeClass: { type: string }
                env:
                  type: array
                  description: 'Extra gateway env — provider keys (secretRef), base URLs, model selectors. The operator adds the provider conventions.'
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, minLength: 1 }
                      value: { type: string, description: 'Literal value.' }
                      secretRef:
                        type: object
                        description: 'Inject from a Secret (key defaults to the env var name).'
                        required: [secretName]
                        properties:
                          secretName: { type: string, minLength: 1 }
                          key: { type: string }
                ui:
                  type: object
                  description: 'Expose the gateway web UI (e.g. the Hermes dashboard) to humans behind a platform-managed auth front. Off by default (the gateway port is machine-only).'
                  required: [auth]
                  properties:
                    expose: { type: boolean, description: 'Turn on the authenticated UI surface.' }
                    port: { type: integer, format: int32, minimum: 0, description: 'Auth-proxy listen / UI Service port (default 8643); must differ from the gateway port.' }
                    upstreamPort: { type: integer, format: int32, minimum: 0, description: 'In-pod port the auth-front proxies to (the UI/dashboard). 0 = provider default (hermes: 9119), else the gateway port.' }
                    auth:
                      type: object
                      required: [mode]
                      description: 'Human-auth front for the UI.'
                      properties:
                        mode: { type: string, enum: [sharedSecret, oidcProxy, oidcNative], description: 'sharedSecret = HTTP basic-auth from an htpasswd Secret. oidcProxy = an oauth2-proxy sidecar against an OIDC IdP (bundled Dex/Keycloak per D9), cookie-based. oidcNative = no sidecar; the gateway dashboard is its own OIDC RP (Hermes self_hosted PKCE) — required for dashboards whose real-time WebSocket/SSE transport needs the gateway''s own gated cookie session.' }
                        secretRef:
                          type: object
                          description: 'Auth material. sharedSecret: a Secret whose key (default "htpasswd") holds htpasswd lines (user:bcrypt).'
                          required: [secretName]
                          properties:
                            secretName: { type: string, minLength: 1 }
                            key: { type: string }
                        oidc:
                          type: object
                          description: 'OIDC config for oidcProxy (oauth2-proxy sidecar) and oidcNative (dashboard self_hosted PKCE). secretRef is required for oidcProxy only — the operator enforces per-mode.'
                          required: [issuer, clientID, redirectURL]
                          properties:
                            issuer: { type: string, minLength: 1, description: 'OIDC issuer URL (iss), e.g. https://dex.example.com.' }
                            clientID: { type: string, minLength: 1, description: 'OIDC client id registered at the IdP.' }
                            redirectURL: { type: string, minLength: 1, description: 'Public callback, e.g. https://hermes.example.com/oauth2/callback.' }
                            loginURL: { type: string, description: 'Pin the IdP authorize URL (skips discovery; set with redeemURL+jwksURL).' }
                            redeemURL: { type: string, description: 'Pin the token endpoint — use an in-cluster URL to avoid the issuer private-CA TLS.' }
                            jwksURL: { type: string, description: 'Pin the JWKS endpoint — in-cluster URL.' }
                            emailDomain: { type: string, description: 'Restrict which IdP emails may log in ("*" = any). Default "*".' }
                            secretRef:
                              type: object
                              description: 'Secret holding client-secret + cookie-secret keys.'
                              required: [secretName]
                              properties:
                                secretName: { type: string, minLength: 1 }
                                key: { type: string }
            status:
              type: object
              description: Observed gateway state.
              properties:
                phase: { type: string, description: 'Pending | Ready | Failed.' }
                observedGeneration: { type: integer }
                endpoint: { type: string, description: 'In-cluster base URL agents point harness.http.url at (append the API path).' }
                uiEndpoint: { type: string, description: 'In-cluster base URL of the authenticated UI Service (set only when ui.expose=true). Port-forward this to reach the dashboard.' }
                reason: { type: string }
                message: { type: string }
                conditions:
                  type: array
                  description: Conditions follows the standard Kubernetes condition pattern (Ready/Progressing), enabling `kubectl wait --for=condition=Ready`.
                  items:
                    type: object
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime: { type: string, format: date-time, description: 'Last time the condition transitioned from one status to another.' }
                      message: { type: string, maxLength: 32768, description: 'Human readable message indicating details about the transition.' }
                      observedGeneration: { type: integer, format: int64, minimum: 0, description: 'The .metadata.generation the condition was set based upon.' }
                      reason: { type: string, maxLength: 1024, minLength: 1, pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$', description: 'Programmatic identifier for the condition''s last transition (CamelCase).' }
                      status: { type: string, enum: ["True", "False", "Unknown"], description: 'Status of the condition.' }
                      type: { type: string, maxLength: 316, pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$', description: 'Type of condition in CamelCase.' }
